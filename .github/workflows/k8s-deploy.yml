# =============================================================================
# Backend · K8s Deploy — thin caller of the shared reusable (ci) k8s-deploy.
#
# This is the Kubernetes DEV delivery trigger for rova (§11). It builds each
# service image, attests it, and — on main — bumps the dev tag in `gitops`, from
# where ArgoCD reconciles. A product repository never touches a cluster.
#
# ── RUNS ALONGSIDE backend-deploy.yml, IT DOES NOT REPLACE IT (§17b) ──────────
# rova is the first product to migrate (§17, reordered 2026-09-17). §17b requires
# BOTH platforms to run simultaneously and the cutover to be reversible at every
# step, so during the migration this file lives NEXT TO backend-deploy.yml and
# both fire on a merge to main:
#
#   backend-deploy.yml  → ECS path (build · attest · promote · MIGRATE · roll)
#   k8s-deploy.yml       → Kubernetes path (build · attest · bump gitops dev tag)
#
# Nothing is deleted from ECS until Phase 5. Until then the ECS path's
# `ecs-run-task` / `run-db-migration` REMAINS the thing that runs every product's
# database migrations. This workflow does NOT run migrations: on the Kubernetes
# path the `migrator` service is a Job wired as an ArgoCD PreSync hook in
# `gitops`, so the schema is applied by ArgoCD before the api/worker roll — not
# here. That is why this caller builds the migrator image (so the Job has an
# image to run) but never invokes it (§11).
#
# Promotion to prod is a SEPARATE act and a SEPARATE workflow — see
# k8s-promote.yml. §11 records the original bug: the promote job was gated on
# `workflow_dispatch` inside a `workflow_call`, where it can never fire; the fix
# was making promotion its own workflow. Do not fold it back in here.
# =============================================================================
name: Backend · K8s Deploy

# ── DISABLED (2026-10-12) ─────────────────────────────────────────────────────────────────────────────
# This workflow does not run on push any more. Its `push` trigger is kept below, commented out, to be
# restored. Why: it built three arm64 images on every merge to main and failed on every one of them since
# 2026-10-07 at `deploy-dev` ("Input required and not supplied: token": the GITOPS_DEV_TOKEN secret does not
# exist), and the cluster it deploys to is not built yet. ECS (backend-deploy.yml) is the live path.
#
# It is ALSO disabled in the repository's Actions settings (state `disabled_manually`), which survives edits to
# this file. To bring it back, both must be undone, after the workflow points at the on-prem cluster and the
# GITOPS_DEV_TOKEN secret exists (ONPREM-SERVER-SETUP-RUNBOOK §13, step 7):
#   1. restore the `push:` block below (delete the leading `# ` of the commented lines);
#   2. `gh workflow enable k8s-deploy.yml --repo quynhonsemiconductor/rova`.
# Until then only the manual `workflow_dispatch` below can start it.
on:
  # push:
  #   branches: [main]
  #   # Same develop-path filter as backend-deploy.yml: skip when a merge touches
  #   # ONLY paths this service does not ship (docs and the web app). paths-ignore
  #   # fires only if EVERY changed file matches, so a shared change still deploys
  #   # and under-deploy is impossible. Kept in lockstep with backend-deploy.yml on
  #   # purpose — during the migration (§17b) the two paths must deploy the SAME set
  #   # of merges, or dev on one platform silently drifts from the other.
  #   #
  #   # No `tags:` trigger here, unlike backend-deploy.yml: on the Kubernetes path a
  #   # release tag is handled by k8s-promote.yml, not by rebuilding here (§11 — the
  #   # promoted image is the exact bytes that soaked in dev, never a fresh build).
  #   paths-ignore:
  #     - '**/*.md'
  #     - 'docs/**'
  #     - '.claude/**'
  #     - 'apps/web/**'

  # Manual redeploy of whatever main currently holds — develop only. Mirrors
  # backend-deploy.yml: a merged fix can otherwise become undeployable when its
  # CI run is cancelled by a following merge and every later merge is web-only
  # (paths-ignore). There is no prod path here to skip, so this is safe.
  workflow_dispatch:

concurrency:
  # One k8s deploy per product at a time. The reusable already sets this same
  # group so the gitops bump cannot race itself; declaring it here too stops two
  # caller runs (e.g. a push racing a workflow_dispatch) reaching the reusable at
  # once. Only the develop path exists here, so a single group is correct.
  group: k8s-deploy-backend-rova
  cancel-in-progress: false   # never cancel a running deploy

jobs:
  deploy:
    # Must match the UNION of the reusable's inner job permissions, not just its
    # top-level default — GitHub validates a reusable call's whole permission
    # chain at trigger time, so an under-grant here is a startup_failure before
    # any job runs, not a runtime denial. id-token is the AWS OIDC for the build
    # job's ECR login; attestations is build provenance; packages:write pushes
    # the image to ghcr.io (ci P0-20) and covers the private
    # @quynhonsemiconductor/* pulls the Dockerfile makes.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    uses: quynhonsemiconductor/ci/.github/workflows/k8s-deploy.yml@0feca69debe06835300c1e28cf14ac5723577a51 # v1.24.0
    with:
      product: rova
      # ── Service list — MUST match gitops/values/rova/base.yaml EXACTLY ───────
      # ci/scripts/platform_conformance.py checks the chart's services against
      # the infra IRSA roles; a mismatch here produces a pod that can assume
      # nothing. base.yaml (2026-09-15) declares api, worker, migrator in this
      # order. `services` is the space-separated form the gitops bump reads;
      # `services-json` is the same list as the build matrix.
      services: 'api worker migrator'
      services-json: '["api","worker","migrator"]'
      # ── Graviton (§15) ──────────────────────────────────────────────────────
      # The on-prem k3s host is amd64 (Ryzen 9 9950X), and gitops now defaults to amd64, so this caller builds
      # linux/amd64. (ECS keeps running the arm64 entry of the multi-arch images that backend-deploy.yml builds.)
      platforms: linux/amd64
      # NATIVE x86 runner, REQUIRED with amd64: the reusable's `build_runner` default is the ARM runner (it pairs with its arm64 `platforms`
      # default), so linux/amd64 on the default would be emulated under QEMU, and a QEMU build of this pnpm + Nest compile fails.
      build_runner: ubuntu-24.04
      # ── ONE IMAGE PER DOCKERFILE STAGE ────────────────────────────────────────
      # The reusable passes `build-target: <service>`, which this Dockerfile REQUIRES:
      # it has a stage per service (`api`, `worker`, `migrator`), and with no target
      # Docker builds the LAST one. That shipped `rova-api` and `rova-worker` as
      # byte-identical copies of the migrator, so every api pod ran migrate.js and died
      # with "permission denied for database rova" — an error about grants that were
      # correct, rather than about an image that was not.
      #
      # Nothing here needs setting. The note exists because the symptom points somewhere
      # else entirely, and three repositories holding the same image looks healthy.
    secrets:
      # ── The AWS role the build/attest job assumes via OIDC ───────────────────
      # The reusable takes the role ARN directly (it does not derive it). The
      # build job only needs ECR push + attestation, which is exactly the scope
      # of rova's EXISTING ECS ECR-push role — the ECS reusable assumes
      # `arn:aws:iam::<acct>:role/rova-github-ecr-push` for the same build step
      # (ci/.github/workflows/backend-deploy.yml). So the k8s build path REUSES
      # that role rather than needing a new one; only its OIDC trust policy must
      # also allow this workflow's subject. AWS_ACCOUNT_ID is the same repo var
      # backend-deploy.yml passes.
      aws-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rova-github-ecr-push
      # ── The gitops identity is the qnsc-automation GitHub App (ci P0-21) ─────
      # The reusable mints a job-scoped App token for `gitops` itself
      # (contents:write only). Org secrets do NOT flow into a reusable workflow
      # uninvited, so the key is passed explicitly here. The old long-lived
      # GITOPS_DEV_TOKEN repo secret is gone with it — retire the secret in the
      # org settings after this merges.
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
