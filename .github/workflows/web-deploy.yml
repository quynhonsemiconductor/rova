# =============================================================================
# Web · Deploy — thin caller of the shared reusable (ci).
#
# Triggers:
#   develop → push to main (auto)
#   prod    → push a semver tag v*.*.*  (gated by the "production" GitHub
#             Environment's required reviewer, enforced inside the reusable)
#
# The reusable builds the Vite bundle and publishes it to Cloudflare Pages.
# VITE_*/PAGES_PROJECT/APP_URL are env-scoped GitHub vars; the Cloudflare creds
# (+ optional Slack webhook) are passed explicitly to the reusable
# (least-privilege, no `secrets: inherit`).
# =============================================================================
name: Web · Deploy

on:
  push:
    branches: [main]
    # Skip the develop build+deploy when a merge touches ONLY paths this service
    # doesn't ship: docs and the backend (api/worker/libs/db/Dockerfile/nest
    # config). paths-ignore fires only if EVERY changed file matches — a shared
    # change (root lockfile, package.json) still deploys, so under-deploy is
    # impossible. Release tags always change package.json + manifest (root, never
    # ignored) → prod never skipped.
    #
    # `infra/**` is deliberately NOT ignored, though it once was. Terraform owns
    # the Pages project's environment — `API_ORIGIN` is set by module "web" — and
    # a Pages env change only reaches the SPA on its next deployment. So an
    # infra-only merge could change API_ORIGIN with nothing publishing it, leaving
    # the deployed SPA calling the old origin. Same shape as the backend's
    # task-definition gap; see backend-deploy.yml for the full reasoning.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'libs/**'
      - 'db/**'
      - 'Dockerfile'
      - 'nest-cli.json'
      - 'tsconfig.migrator.json'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # semver only — no -rc suffix

concurrency:
  # Serialize by ENVIRONMENT, not raw ref: all prod (tag) deploys share one
  # group so prod DB migrations never run concurrently; develop shares another.
  # prod and develop still run in parallel (different groups).
  group: deploy-web-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'develop' }}
  cancel-in-progress: false   # never cancel a running deploy

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Ordering gate — never publish the SPA ahead of its own infrastructure.
  #
  # Mirrors backend-deploy's job of the same name, and exists for the same reason:
  # Terraform owns the Pages project's `API_ORIGIN`, and a Pages env change only
  # reaches the SPA on its next deployment. Now that `infra/**` triggers this
  # workflow, an infra commit would otherwise race its own apply and publish a
  # bundle against the PREVIOUS origin.
  #
  # Deterministic by design, keyed on the commit sha so it can never wait on an
  # unrelated run:
  #   - commit does NOT touch infra/live/** → no infra run exists, proceed at once
  #   - commit DOES touch infra/live/**     → wait for that run on THIS sha
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-infra:
    name: Wait for infrastructure
    runs-on: ubuntu-latest
    # Generous: on a tag this waits for apply-prod, which sits behind the
    # `production` environment's required reviewer. Timing out here is safe — the
    # deploy is re-runnable — but it should not fire because an approver stepped
    # away.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # IDENTITY 8 GUARD (tags only). The release that carries identity 8 cannot be tagged until prod is READY for it (the runbook:
      # docs/runbooks/identity-v8-cutover.md), and prod's migrator image only ever comes from a release tag, so tags are FROZEN from the
      # identity 8 merge until the prod window: this step is what enforces the freeze. Two flags must be true in infra/live/prod/main.tf:
      #   - better_auth_secret_set: the v8 API cannot start without BETTER_AUTH_SECRET; the circuit breaker would roll the API back to v7
      #     while the worker stays v8 and the SPA (published by the web deploy of the same tag) is already v8;
      #   - edge_client_ip_secret_set: without it the API falls back to cf-connecting-ip, which behind the Pages Function is ONE Cloudflare
      #     address for every visitor, so the new address-keyed rate limit and identity's own sign-in limits become company-wide on the
      #     morning everyone signs in again.
      # Failing HERE, before the migrator and before any publish, leaves prod exactly as it was. The cutover release IS the first tag cut
      # after both are true (and, if the owner opts in, after `identity_v8_backfill_on_deploy = true`, which makes that tag's migrator
      # commit the backfill).
      - name: Refuse a prod tag until prod is ready for identity 8
        if: github.ref_type == 'tag'
        run: |
          missing=""
          for flag in better_auth_secret_set edge_client_ip_secret_set; do
            grep -Eq "^[[:space:]]*${flag}[[:space:]]*=[[:space:]]*true([[:space:]]|$)" infra/live/prod/main.tf || missing="$missing $flag"
          done
          if [ -n "$missing" ]; then
            echo "::error::infra/live/prod/main.tf does not set:${missing} = true. This tag carries identity 8 and prod is not ready for it. Prod releases are frozen from the identity 8 merge until the prod cutover window: see docs/runbooks/identity-v8-cutover.md."
            exit 1
          fi

      - name: Does this commit change infrastructure?
        id: touched
        run: |
          # Tags ALWAYS gate. infra-apply's apply-prod job is `if: ref_type ==
          # 'tag'`, so a tag is the ONLY thing that applies prod infra — and the
          # prod web deploy fires on the same tag. Path filters are also not
          # applied to tag pushes, so infra-apply always runs for a tag.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # infra/modules/** counts too — `module "stack"` is a LOCAL path module, so a
          # module-only commit changes the plan and triggers infra-apply. Matching only
          # infra/live/ here would let this deploy race ahead of that apply.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^infra/(live|modules)/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Infrastructure · Apply on this commit
        if: steps.touched.outputs.infra == 'true'
        # Shared with backend-deploy and three other repos — see `quynhonsemiconductor/ci`.
        # A rate limit is retried there rather than reported as a failed upstream run.
        uses: quynhonsemiconductor/ci/actions/wait-for-run@v1
        with:
          workflow: infra-apply.yml
          label: Infrastructure · Apply
          if-missing: warn
          missing-message: >-
            infra/live changed but no Infrastructure · Apply run was found for this commit.

  # ───────────────────────────────────────────────────────────────────────────
  # CI gate — a red main must not deploy.
  #
  # Block the develop (push-to-main) deploy until the "Web · CI" run for THIS
  # commit has finished successfully. Keys on the commit sha, so it can never
  # wait on an unrelated run. Mirrors backend-deploy's wait-for-infra gate.
  #
  #   - tag push → CI does not run on tags (it triggers on push-to-main / PRs),
  #     and prod is gated by the "production" Environment reviewer inside the
  #     reusable, so there is nothing to await → proceed at once.
  #   - push to main → wait for Web · CI on this sha; the shared `wait-for-run` action
  #     propagates its conclusion, so a failed/timed-out CI blocks the deploy.
  #
  # Fails closed: if no CI run is found for the sha, block rather than ship blind.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for Web · CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least-privilege: read the commit and query sibling runs. Nothing else.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Web · CI on this commit
        uses: quynhonsemiconductor/ci/actions/wait-for-run@v1
        with:
          workflow: web-ci.yml
          branch: main
          label: Web · CI
          if-missing: fail
          missing-message: >-
            No Web · CI run was found for this commit.

  # ───────────────────────────────────────────────────────────────────────────
  # Backend gate (tags only) — the SPA of a release must not go live ahead of that release's API.
  #
  # The web deploy and the backend deploy of one tag are independent workflows. The backend one runs a migration, rolls ECS and can
  # be rolled back by the circuit breaker; the web one publishes in a minute. Without this the SPA of the tag (identity 8: it calls
  # /api/auth/* and /v1/auth/me) could be live against the previous API for the whole backend deploy, or for good if that deploy
  # is rolled back. On develop the gap is a known maintenance window (docs/runbooks/identity-v8-cutover.md); prod has none.
  # `branch` is the tag name: the backend run for a tag has the tag as its head ref (the develop run's is `main`).
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-backend:
    name: Wait for this tag's Backend · Deploy
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # LONGER than the infrastructure gate's 120: this waits for the backend deploy, which itself waits for apply-prod and the `production`
    # environment's required reviewer, then migrates (and on the cutover tag runs the backfill) and rolls. If this expires first the
    # web deploy fails, and a re-run is the way out, but a SPA that goes live ahead of its API is the failure this job exists to prevent
    # (a v8 SPA against a v7 API). When it does expire: re-run the web jobs once the backend deploy is green (runbook).
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Backend · Deploy of this tag
        uses: quynhonsemiconductor/ci/actions/wait-for-run@v1
        with:
          workflow: backend-deploy.yml
          branch: ${{ github.ref_name }}
          label: prod Backend · Deploy
          if-missing: fail
          missing-message: >-
            No Backend · Deploy run was found for this tag. Publishing the SPA without its API is the failure this gate exists for.

  deploy:
    needs: [wait-for-infra, wait-for-ci, wait-for-backend]
    # `wait-for-backend` is skipped on a push to main; a skipped need must not skip the deploy.
    if: ${{ !cancelled() && !failure() }}
    # Must match the UNION of every inner job's own permissions in the reusable
    # web-deploy.yml, not just its top-level default (contents: read) — GitHub
    # validates a reusable call's whole permission chain at trigger time, and
    # a caller job that only grants the top-level default causes a
    # startup_failure before any job runs. packages:read is for the build
    # job's pnpm install of private @scope/* GitHub Packages.
    permissions:
      contents: read
      packages: read
    uses: quynhonsemiconductor/ci/.github/workflows/web-deploy.yml@v1
    with:
      product: rova
      # Must equal `packageManager` in package.json: pnpm/action-setup refuses to run when the two differ
      # ("Multiple versions of pnpm specified"). The reusable's default is 10.33.2.
      pnpm_version: '11.28.5'
      # Monorepo: run wrangler from the web package dir so it discovers the
      # file-based Pages Functions (apps/web/functions/**) and bundles the
      # /v1/* BFF reverse-proxy. web_dist_path is relative to working_directory.
      working_directory: apps/web
      web_dist_path: dist
    # Least-privilege: pass only what the reusable declares (no `secrets: inherit`).
    secrets:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
