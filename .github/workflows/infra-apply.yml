name: Infrastructure · Apply
# What the run list shows. Without this a dispatch with `allow_destructive` on is indistinguishable, in the
# list, from one with it off, and it is the one that may delete DNS records. A push or tag shows its ref.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Infrastructure · Apply · dispatch · {0}{1}', inputs.target, inputs.allow_destructive && ' · ALLOW DESTRUCTIVE' || '') || format('Infrastructure · Apply · {0}', github.ref_name) }}

# ─────────────────────────────────────────────────────────────────────────────
# Infra apply, gated the same way as the app deploys (backend-deploy.yml):
#   push to main       → apply _shared + develop  (auto)
#   push a v*.*.* tag  → apply _shared + prod      (prod also gated by the
#                        "production" GitHub Environment's required reviewer)
#
# Prod infra can NOT be applied by a normal merge to main — it only happens on
# a deliberate semver tag, so an accidental push can never touch production.
#
# PREREQUISITE (Option A shared runtime): the platform shared-runtime stacks in
# qnsc-infra — runtime-dev (for develop) and runtime-prod (for prod) — own the
# shared VPC/NAT/ALB (+ prod cache/WAF) and MUST be applied before this product
# stack. develop/prod consume them via terraform_remote_state, so a product
# apply fails if the runtime state doesn't exist yet. The platform pipeline
# applies runtime first.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "infra/live/**"
      # modules/** matters too: `module "stack"` is a LOCAL path module
      # (source = "../../modules/stack"), so editing it changes the plan for both
      # environments. Without this, a module-only change merged to main was never
      # applied — the plan diverged from reality silently until the next unrelated
      # live/** edit picked it up and applied both at once.
      - "infra/modules/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to apply. Prod still requires the `production` environment's approval."
        type: choice
        default: develop
        options:
          - develop
          - prod
      allow_destructive:
        description: "Let this run delete or replace DNS / identity resources (destructive-guard). Off by default; on a push the label `allow-dns-destroy` on the merged PR does the same."
        type: boolean
        default: false

# `prod` is reachable by dispatch as well as by tag, because coupling infrastructure applies
# to product releases is what let prod drift. Between 2026-09-06 and 2026-09-13 no tag was
# cut, so prod never received a merged `alarm_emails` fix and `rova-prod-alarms` sat with
# zero subscribers while its CPU alarm fired into nothing. The apply had nowhere to run
# short of shipping a week of application code.
#
# The default is `develop`, deliberately: a dispatch with no thought behind it must not be
# able to touch production. And the prod job keeps `environment: production`, so a dispatch
# still waits for that environment's approval — this widens WHO CAN TRIGGER an apply, not
# who can authorise one.

# Serialize by ENVIRONMENT, matching backend-deploy.yml and web-deploy.yml: all
# prod (tag) applies share one group, all develop (branch) applies share another,
# and the two run in PARALLEL.
#
# This was one constant group for the whole repo, to stop a release's near-
# simultaneous main push and vX.Y.Z tag running apply-shared against the same
# infra/live/_shared state concurrently — a real bug, state-lock failure on every
# release. But a repo-wide group also makes DEVELOP queue behind PROD, and prod is
# gated on a required reviewer, so an unapproved production apply froze every
# develop apply until a human noticed. It silently swallowed two of them.
#
# The shared-state collision is a property of ONE JOB, so it is fixed at that job
# (see apply-shared's own `concurrency` below) instead of by serialising the whole
# workflow. Develop and prod touch different state files and different
# environments; nothing else about them needs to be mutually exclusive.
#
# Never cancel a running apply.
concurrency:
  # A DISPATCHED prod apply counts as prod. Keyed off ref_type alone, `target: prod` would
  # land in the develop group and could run concurrently with a develop apply — two applies,
  # two different state files, one lock table, and the failure only shows up as a lock
  # timeout at the worst moment.
  group: infra-apply-${{ github.repository }}-${{ ((github.event_name != 'workflow_dispatch' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')) && 'prod' || 'develop' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Preflight — a PROD apply is only ever for a release tag.
  #
  # `apply-prod` runs when the ref is a tag OR when a dispatch asks for `target: prod`, and it pins the prod
  # image with `TF_VAR_image_tag: ${{ github.ref_name }}`. Dispatched from `main` that is the string `main`:
  # prod's task definition would be pointed at an image tag that is not a release (the `production` approval
  # shows the reviewer a job, not that value). The same goes for a dispatch from any branch, or from a tag
  # that is not a release tag.
  #
  # This is a JOB, not a first step of apply-prod, on purpose: a job with `environment: production` waits for
  # its reviewer BEFORE any of its steps run (so a step would ask for an approval and only then refuse), and
  # `apply-shared` would already have applied. Everything needs this job, so a refused run applies nothing and
  # asks nobody. There is deliberately no separate tag input: the ref IS the tag, one source of truth.
  # ─────────────────────────────────────────────────────────────────────────────
  preflight:
    name: Preflight (a prod apply needs a release tag)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse a prod apply that is not for a release tag
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Production is applied by a dispatch that asks for it, or by a tag push: exactly apply-prod's `if`. A dispatch
          # from a tag with target=develop is not a prod apply.
          prod=false
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$TARGET" = prod ]; then prod=true; fi
          elif [ "$REF_TYPE" = tag ]; then prod=true; fi
          # Develop applies run from a branch. A dispatch from a tag with target=develop would apply _shared from that
          # tag's code and then skip develop: refuse it before anything applies.
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF_TYPE" = tag ] && [ "$TARGET" != prod ]; then
            echo "::error title=develop apply refused::A dispatch from tag '$REF_NAME' with target '$TARGET' would apply _shared from that tag's code and skip develop. Develop applies run from a branch. Nothing was applied. Run it from main: gh workflow run infra-apply.yml --ref main -f target=develop"
            exit 1
          fi
          release=false
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then release=true; fi
          if [ "$prod" = true ] && [ "$release" = false ]; then
            echo "::error title=prod apply refused::This run would apply PRODUCTION from $REF_TYPE '$REF_NAME', which is not a release tag (vX.Y.Z), and would pin the prod image to the tag '$REF_NAME'. Nothing was applied. Run it from a release tag: gh workflow run infra-apply.yml --ref vX.Y.Z -f target=prod"
            exit 1
          fi
          echo "ok: prod=$prod, ref=$REF_TYPE '$REF_NAME'"

  # ─────────────────────────────────────────────────────────────────────────────
  # Shared (ECR + OIDC roles) — always applies first (both branch and tag runs).
  # ─────────────────────────────────────────────────────────────────────────────
  apply-shared:
    needs: preflight
    runs-on: ubuntu-latest
    environment: shared
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      pull-requests: read # destructive-guard reads the labels of the PR being merged

    # The one thing that genuinely must not run twice at once, and the reason the
    # whole workflow used to share a group: a release pushes main and the vX.Y.Z tag
    # near-simultaneously, so both runs reach this job and would apply the same
    # infra/live/_shared state concurrently — state-lock failure on every release.
    #
    # A CONSTANT group here (not keyed on ref) keeps that serialised while leaving the
    # per-environment applies free to run in parallel. This job holds the lock only
    # while it is actually applying: the production approval gate is on apply-prod, a
    # separate job, so a release waiting for a reviewer no longer blocks develop.
    concurrency:
      group: infra-apply-shared-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rova-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/_shared
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/_shared
        run: tofu validate

      # Plan, then apply THAT PLAN. A bare `tofu apply -auto-approve` plans again and applies the result without any
      # check reading it: on 2026-10-09 a provider lock bump turned nine DNS/edge resources into "replace"
      # (zone_id -> null) and that is what was applied. Here the plan is printed by a step and saved to a file, and
      # the next step applies that file, so what the log shows is what runs, and a guard can read the same file.
      #
      # Variables are given to the PLAN steps only. A saved plan carries its own variable values: OpenTofu 1.9 (this
      # workflow's version) ignores a TF_VAR_* in the environment at apply time, and later versions refuse a
      # different one ("Mismatch between input and plan variable value"). Either way the apply steps deliberately
      # have no `env`. The plan files hold those values (sensitive ones included): they stay on this runner and are
      # never uploaded.
      - name: tofu plan (saved as tfplan)
        working-directory: infra/live/_shared
        run: tofu plan -input=false -out=tfplan
        env:
          # REQUIRED by infra/live/_shared (validated, no default). An organisation variable.
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

      # Refuse a saved plan that DELETES or REPLACES a DNS, edge, mail-identity, certificate or key resource (the
      # 2026-10-09 outage) unless this run is allowed to: the PR being merged carries the label `allow-dns-destroy`
      # (ON TAG RUNS THE LOOKUP RESOLVES TO THE RELEASE PR, so a destructive prod change needs the label on the
      # release PR), or a manual dispatch passed `allow_destructive`. It judges `tfplan` through `tofu show -json`
      # (piped, never written out): byte for byte the plan the next step applies. See
      # docs/runbooks/infra-destructive-guard.md.
      - name: destructive-guard (tfplan)
        uses: quynhonsemiconductor/ci/actions/destructive-guard@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          working-directory: infra/live/_shared
          plan-file: tfplan
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply (the saved plan)
        working-directory: infra/live/_shared
        run: tofu apply -input=false tfplan

  # ─────────────────────────────────────────────────────────────────────────────
  # Develop — only on a branch push to main (NOT on tag pushes).
  # ─────────────────────────────────────────────────────────────────────────────
  apply-develop:
    needs: apply-shared
    if: github.ref_type == 'branch' && inputs.target != 'prod'
    runs-on: ubuntu-latest
    environment: develop   # no approval gate
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      pull-requests: read # destructive-guard reads the labels of the PR being merged

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rova-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/develop
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/develop
        run: tofu validate

      # Plan, then apply THAT PLAN. A bare `tofu apply -auto-approve` plans again and applies the result without any
      # check reading it: on 2026-10-09 a provider lock bump turned nine DNS/edge resources into "replace"
      # (zone_id -> null) and that is what was applied. Here the plan is printed by a step and saved to a file, and
      # the next step applies that file, so what the log shows is what runs, and a guard can read the same file.
      #
      # Variables are given to the PLAN steps only. A saved plan carries its own variable values: OpenTofu 1.9 (this
      # workflow's version) ignores a TF_VAR_* in the environment at apply time, and later versions refuse a
      # different one ("Mismatch between input and plan variable value"). Either way the apply steps deliberately
      # have no `env`. The plan files hold those values (sensitive ones included): they stay on this runner and are
      # never uploaded.
      #
      # The job converges in TWO passes, kept as they were; each pass is now a plan and then an apply of that plan.
      #   Pass 1: a large rename shifts secret/config ARNs that gate count-based resources, which OpenTofu cannot
      #   resolve at plan time. Pass 1 excludes those modules to create their dependencies; pass 2 converges. After
      #   the first converged apply this is a normal single-pass no-op.

      - name: tofu plan, pass 1 (saved as tfplan-pass1)
        id: pass1
        working-directory: infra/live/develop
        run: |
          set -uo pipefail
          if tofu plan -input=false -out=tfplan-pass1 \
               -exclude=module.stack.module.api.data.aws_iam_policy_document.execution_secrets \
               -exclude=module.stack.module.worker.data.aws_iam_policy_document.execution_secrets \
               -exclude=module.stack.module.firelens_agent_api \
               -exclude=module.stack.module.firelens_agent_worker; then
            echo "planned=true" >> "$GITHUB_OUTPUT"
          else
            # Pass 1 used to be `tofu apply ... || true`: a failure was ignored and pass 2 converged anyway.
            # That is kept, but said out loud, and a pass that did not plan is never applied.
            echo "planned=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=pass 1::the first (partial) plan failed; pass 2 below plans and applies everything on its own."
          fi
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_grafana_alerting_auth: ${{ secrets.GRAFANA_ALERTS_TOKEN }}
          # Staff emails (platform_admin_emails) are not in git: an organisation
          # SECRET (masked in logs) into a sensitive variable (redacted in plan
          # output). Unset or empty fails validation — it never silently removes
          # all workspace admins.
          TF_VAR_platform_admin_emails: ${{ secrets.ROVA_PLATFORM_ADMIN_EMAILS }}

      # Refuse a saved plan that DELETES or REPLACES a DNS, edge, mail-identity, certificate or key resource (the
      # 2026-10-09 outage) unless this run is allowed to: the PR being merged carries the label `allow-dns-destroy`
      # (ON TAG RUNS THE LOOKUP RESOLVES TO THE RELEASE PR, so a destructive prod change needs the label on the
      # release PR), or a manual dispatch passed `allow_destructive`. It judges `tfplan-pass1` through `tofu show -json`
      # (piped, never written out): byte for byte the plan the next step applies. See
      # docs/runbooks/infra-destructive-guard.md.
      - name: destructive-guard (tfplan-pass1)
        if: steps.pass1.outputs.planned == 'true'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          working-directory: infra/live/develop
          plan-file: tfplan-pass1
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply, pass 1 (the saved plan)
        if: steps.pass1.outputs.planned == 'true'
        working-directory: infra/live/develop
        run: |
          tofu apply -input=false tfplan-pass1 || echo "::warning title=pass 1::the first (partial) apply failed; pass 2 below converges."

      # -refresh=false on the converge pass: the RDS subnet group carries a permanent cosmetic name divergence (the
      # instance sits in a same-VPC group AWS refuses to swap in place, InvalidVPCNetworkStateFault). State already
      # holds the desired name, so refreshing only re-detects an unfixable diff and fails the apply. Skipping
      # refresh keeps the apply convergent; real drift is still caught by the plan job on PRs.

      - name: tofu plan, pass 2 (saved as tfplan)
        working-directory: infra/live/develop
        run: tofu plan -refresh=false -input=false -out=tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_grafana_alerting_auth: ${{ secrets.GRAFANA_ALERTS_TOKEN }}
          # Staff emails (platform_admin_emails) are not in git: an organisation
          # SECRET (masked in logs) into a sensitive variable (redacted in plan
          # output). Unset or empty fails validation — it never silently removes
          # all workspace admins.
          TF_VAR_platform_admin_emails: ${{ secrets.ROVA_PLATFORM_ADMIN_EMAILS }}

      # Refuse a saved plan that DELETES or REPLACES a DNS, edge, mail-identity, certificate or key resource (the
      # 2026-10-09 outage) unless this run is allowed to: the PR being merged carries the label `allow-dns-destroy`
      # (ON TAG RUNS THE LOOKUP RESOLVES TO THE RELEASE PR, so a destructive prod change needs the label on the
      # release PR), or a manual dispatch passed `allow_destructive`. It judges `tfplan` through `tofu show -json`
      # (piped, never written out): byte for byte the plan the next step applies. See
      # docs/runbooks/infra-destructive-guard.md.
      - name: destructive-guard (tfplan)
        uses: quynhonsemiconductor/ci/actions/destructive-guard@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          working-directory: infra/live/develop
          plan-file: tfplan
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply, pass 2 (the saved plan)
        working-directory: infra/live/develop
        run: tofu apply -input=false tfplan

      # Mint a short-lived installation token from the qnsc-automation GitHub App
      # (same app release.yml uses) so we never need a long-lived user PAT.
      # Requires the app to have "Variables: read and write" on this repo.
      # Falls back to no token (publish step skipped) when the app isn't set.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3
        id: app-token
        if: ${{ vars.QNSC_AUTOMATION_APP_ID != '' }}
        continue-on-error: true
        with:
          app-id: ${{ vars.QNSC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}

      # Sync the infra IDs the deploy workflows read (backend-deploy.yml)
      # straight from Terraform outputs, so a rebuild that changes subnet/SG
      # IDs can never leave the vars stale.
      # Skipped automatically when no app token could be minted. A write may be
      # rejected on a protected environment (App installation tokens cannot
      # write vars to an env with required reviewers) — we surface that as a
      # visible ::warning:: (never a silent green) but never block the apply.
      - name: Publish infra IDs to develop environment variables
        if: ${{ steps.app-token.outputs.token != '' }}
        working-directory: infra/live/develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          missed=0
          set_var() {
            if gh variable set "$1" --env develop --repo "$REPO" --body "$2"; then
              echo "  set $1"
            else
              echo "::warning title=infra-id publish::could not set '$1' on the develop environment — reconcile manually: gh variable set $1 --env develop --repo $REPO --body '$2'"
              missed=1
            fi
          }
          set_var ECS_CLUSTER           "$(tofu output -raw ecs_cluster_name)"
          set_var ECS_API_SERVICE       "$(tofu output -raw ecs_api_service)"
          set_var ECS_WORKER_SERVICE    "$(tofu output -raw ecs_worker_service)"
          set_var ECS_MIGRATOR_TASK_DEF "$(tofu output -raw ecs_migrator_task_def)"
          set_var ECS_MIGRATOR_SUBNET   "$(tofu output -json private_subnet_ids | jq -r 'join(",")')"
          set_var ECS_MIGRATOR_SG       "$(tofu output -raw sg_app_id)"
          set_var PAGES_PROJECT         "$(tofu output -raw web_pages_project)"
          if [[ $missed -ne 0 ]]; then
            echo "::warning title=infra-id publish::One or more develop infra-ID vars were not auto-published — the deploy reads these, so verify they match Terraform outputs to avoid drift."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Production — only on a v*.*.* tag push, AND requires manual approval via the
  # "production" GitHub Environment (configure a required reviewer there).
  # ─────────────────────────────────────────────────────────────────────────────
  apply-prod:
    needs: apply-shared
    if: (github.event_name != 'workflow_dispatch' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      pull-requests: read # destructive-guard reads the labels of the PR being merged

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rova-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/prod
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/prod
        run: tofu validate

      # Plan, then apply THAT PLAN. A bare `tofu apply -auto-approve` plans again and applies the result without any
      # check reading it: on 2026-10-09 a provider lock bump turned nine DNS/edge resources into "replace"
      # (zone_id -> null) and that is what was applied. Here the plan is printed by a step and saved to a file, and
      # the next step applies that file, so what the log shows is what runs, and a guard can read the same file.
      #
      # Variables are given to the PLAN steps only. A saved plan carries its own variable values: OpenTofu 1.9 (this
      # workflow's version) ignores a TF_VAR_* in the environment at apply time, and later versions refuse a
      # different one ("Mismatch between input and plan variable value"). Either way the apply steps deliberately
      # have no `env`. The plan files hold those values (sensitive ones included): they stay on this runner and are
      # never uploaded.
      #
      # The job converges in TWO passes, kept as they were; each pass is now a plan and then an apply of that plan.
      #   Pass 1, identical to develop: the api/worker execution_secrets policy docs and the firelens agents are
      #   count-dependent on resources that do not exist yet on the FIRST apply under a renamed product
      #   (rally -> rova), so pass 1 excludes those modules to create their dependencies; pass 2 converges.

      - name: tofu plan, pass 1 (saved as tfplan-pass1)
        id: pass1
        working-directory: infra/live/prod
        run: |
          set -uo pipefail
          if tofu plan -input=false -out=tfplan-pass1 \
               -exclude=module.stack.module.api.data.aws_iam_policy_document.execution_secrets \
               -exclude=module.stack.module.worker.data.aws_iam_policy_document.execution_secrets \
               -exclude=module.stack.module.firelens_agent_api \
               -exclude=module.stack.module.firelens_agent_worker; then
            echo "planned=true" >> "$GITHUB_OUTPUT"
          else
            # Pass 1 used to be `tofu apply ... || true`: a failure was ignored and pass 2 converged anyway.
            # That is kept, but said out loud, and a pass that did not plan is never applied.
            echo "planned=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=pass 1::the first (partial) plan failed; pass 2 below plans and applies everything on its own."
          fi
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_grafana_alerting_auth: ${{ secrets.GRAFANA_ALERTS_TOKEN }}
          # Staff emails (platform_admin_emails) are not in git: an organisation
          # SECRET (masked in logs) into a sensitive variable (redacted in plan
          # output). Unset or empty fails validation — it never silently removes
          # all workspace admins.
          TF_VAR_platform_admin_emails: ${{ secrets.ROVA_PLATFORM_ADMIN_EMAILS }}
          # Pin the prod image to the exact release tag that triggered this apply
          # (e.g. v1.4.2), so an infra apply never resets the task def to :latest.
          TF_VAR_image_tag:            ${{ github.ref_name }}

      # TASK 0.3 / §17b: refuse a prod plan that destroys or replaces a database, secret, parameter group or target
      # group unless the stack's .allow-data-destroy names that address with a reason. It reads the saved plan, so it
      # judges exactly what the next step applies.
      - name: plan-guard (tfplan-pass1)
        if: steps.pass1.outputs.planned == 'true'
        uses: quynhonsemiconductor/ci/actions/plan-guard@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          plan-file: tfplan-pass1
          working-directory: infra/live/prod

      # Refuse a saved plan that DELETES or REPLACES a DNS, edge, mail-identity, certificate or key resource (the
      # 2026-10-09 outage) unless this run is allowed to: the PR being merged carries the label `allow-dns-destroy`
      # (ON TAG RUNS THE LOOKUP RESOLVES TO THE RELEASE PR, so a destructive prod change needs the label on the
      # release PR), or a manual dispatch passed `allow_destructive`. It judges `tfplan-pass1` through `tofu show -json`
      # (piped, never written out): byte for byte the plan the next step applies. See
      # docs/runbooks/infra-destructive-guard.md.
      - name: destructive-guard (tfplan-pass1)
        if: steps.pass1.outputs.planned == 'true'
        uses: quynhonsemiconductor/ci/actions/destructive-guard@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          working-directory: infra/live/prod
          plan-file: tfplan-pass1
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply, pass 1 (the saved plan)
        if: steps.pass1.outputs.planned == 'true'
        working-directory: infra/live/prod
        run: |
          tofu apply -input=false tfplan-pass1 || echo "::warning title=pass 1::the first (partial) apply failed; pass 2 below converges."

      # -refresh=false on the converge pass: the RDS subnet group carries a same-VPC divergence (rally-prod-db vs
      # rova-prod-db) that AWS permanently rejects moving; state already holds the desired value, so a refresh
      # re-detects a move that can never apply. Once the rename settles, this can go back to a single-pass apply.

      - name: tofu plan, pass 2 (saved as tfplan)
        working-directory: infra/live/prod
        run: tofu plan -refresh=false -input=false -out=tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_grafana_alerting_auth: ${{ secrets.GRAFANA_ALERTS_TOKEN }}
          # Staff emails (platform_admin_emails) are not in git: an organisation
          # SECRET (masked in logs) into a sensitive variable (redacted in plan
          # output). Unset or empty fails validation — it never silently removes
          # all workspace admins.
          TF_VAR_platform_admin_emails: ${{ secrets.ROVA_PLATFORM_ADMIN_EMAILS }}
          # Pin the prod image to the exact release tag that triggered this apply
          # (e.g. v1.4.2), so an infra apply never resets the task def to :latest.
          TF_VAR_image_tag:            ${{ github.ref_name }}

      # TASK 0.3 / §17b: refuse a prod plan that destroys or replaces a database, secret, parameter group or target
      # group unless the stack's .allow-data-destroy names that address with a reason. It reads the saved plan, so it
      # judges exactly what the next step applies.
      - name: plan-guard (tfplan)
        uses: quynhonsemiconductor/ci/actions/plan-guard@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          plan-file: tfplan
          working-directory: infra/live/prod

      # Refuse a saved plan that DELETES or REPLACES a DNS, edge, mail-identity, certificate or key resource (the
      # 2026-10-09 outage) unless this run is allowed to: the PR being merged carries the label `allow-dns-destroy`
      # (ON TAG RUNS THE LOOKUP RESOLVES TO THE RELEASE PR, so a destructive prod change needs the label on the
      # release PR), or a manual dispatch passed `allow_destructive`. It judges `tfplan` through `tofu show -json`
      # (piped, never written out): byte for byte the plan the next step applies. See
      # docs/runbooks/infra-destructive-guard.md.
      - name: destructive-guard (tfplan)
        uses: quynhonsemiconductor/ci/actions/destructive-guard@5a57261635f88c46fa1e6e553f9b930a138b4b2e # v1.22.0
        with:
          working-directory: infra/live/prod
          plan-file: tfplan
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply, pass 2 (the saved plan)
        working-directory: infra/live/prod
        run: tofu apply -input=false tfplan

      # Mint a short-lived installation token from the qnsc-automation GitHub App so
      # we never need a long-lived user PAT. Requires the app to have
      # "Variables: read and write" on this repo. Falls back to no token
      # (publish step skipped) when the app isn't configured.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3
        id: app-token
        if: ${{ vars.QNSC_AUTOMATION_APP_ID != '' }}
        continue-on-error: true
        with:
          app-id: ${{ vars.QNSC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}

      # Sync the infra IDs the deploy workflows read (backend-deploy.yml) straight
      # from Terraform outputs into the production environment, so a rebuild that
      # changes subnet/SG IDs can never leave the prod vars stale.
      #
      # NOTE: `production` is a PROTECTED environment (required reviewers), and a
      # GitHub App installation token cannot write variables to a protected
      # environment (403 "Resource not accessible by integration"). When that
      # happens we emit a visible ::warning:: naming each var to reconcile —
      # never a silent green — but we do not block the apply. The prod infra IDs
      # are deterministic and stable, so the vars persist between applies; a
      # human reconciles them on the rare infra rebuild that changes an ID.
      - name: Publish infra IDs to production environment variables
        if: ${{ steps.app-token.outputs.token != '' }}
        working-directory: infra/live/prod
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          missed=0
          set_var() {
            if gh variable set "$1" --env production --repo "$REPO" --body "$2"; then
              echo "  set $1"
            else
              echo "::warning title=infra-id publish::could not set '$1' on the production environment (a protected env rejects App-token writes) — reconcile manually: gh variable set $1 --env production --repo $REPO --body '$2'"
              missed=1
            fi
          }
          set_var ECS_CLUSTER           "$(tofu output -raw ecs_cluster_name)"
          set_var ECS_API_SERVICE       "$(tofu output -raw ecs_api_service)"
          set_var ECS_WORKER_SERVICE    "$(tofu output -raw ecs_worker_service)"
          set_var ECS_MIGRATOR_TASK_DEF "$(tofu output -raw ecs_migrator_task_def)"
          set_var ECS_MIGRATOR_SUBNET   "$(tofu output -json private_subnet_ids | jq -r 'join(",")')"
          set_var ECS_MIGRATOR_SG       "$(tofu output -raw sg_app_id)"
          set_var PAGES_PROJECT         "$(tofu output -raw web_pages_project)"
          if [[ $missed -ne 0 ]]; then
            echo "::warning title=infra-id publish::One or more production infra-ID vars were not auto-published — the deploy reads these, so verify they match Terraform outputs to avoid drift."
          fi