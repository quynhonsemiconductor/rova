# =============================================================================
# Release · Promote — a vX.Y.Z tag builds no image and rolls no API by itself.
#
# It takes the image GHCR · Publish already built from the tagged commit
# (sha-<commit12>), adds the alias tag vX.Y.Z to the SAME digests (no rebuild),
# and opens a gitops PR that sets values/rova/tags.prod.yaml to tag + digest.
# A reviewed merge of that PR is the prod API/worker deploy (ArgoCD PreSync
# migrator, then the Deployments roll). Rollback = revert that gitops PR.
#
# It also deploys the PROD SPA from the same tag, in the same run and after the
# image check above (the deploy-web job calls web-deploy-worker.yml), so the
# web follows every release instead of waiting for a manual dispatch. Rollback
# of the web alone = dispatch that workflow with an older tag.
#
# Fails, and opens no PR, if any of the three images is missing for the tagged
# commit (publish did not run or failed for it).
# =============================================================================
name: Release · Promote

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-promote-rova
  cancel-in-progress: false

env:
  GHCR_NAMESPACE: ghcr.io/quynhonsemiconductor
  SERVICES: api worker migrator

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Adds the alias tag vX.Y.Z to existing GHCR packages.
      packages: write
    steps:
      - name: Validate the tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $VERSION"; exit 1; }

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve digests of the tagged commit and add the version tag
        id: images
        env:
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          src="sha-${SHA::12}"
          # GHCR · Publish builds the same commit on push to main, and
          # release-please merges the release PR at the same moment, so this job
          # can start before the build has pushed the sha-<commit12> images.
          # Wait for them (30 s poll, 20 min budget) instead of failing at once.
          deadline=$((SECONDS + 1200))
          json='{}'
          for svc in $SERVICES; do
            repo="$GHCR_NAMESPACE/rova-$svc"
            while :; do
              digest=$(docker buildx imagetools inspect "$repo:$src" --format '{{.Manifest.Digest}}' 2>/dev/null) && break
              [[ $SECONDS -ge $deadline ]] && { echo "::error::$repo:$src does not exist. GHCR · Publish did not build this commit; fix that first."; exit 1; }
              echo "waiting for $repo:$src (${SECONDS}s elapsed)"
              sleep 30
            done
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest for $svc"; exit 1; }
            json=$(jq -c --arg s "$svc" --arg d "$digest" '. + {($s): $d}' <<< "$json")
          done
          # Alias only after ALL three resolved, so a missing image never leaves a half-tagged release.
          for svc in $SERVICES; do
            repo="$GHCR_NAMESPACE/rova-$svc"
            docker buildx imagetools create -t "$repo:$VERSION" "$repo@$(jq -r --arg s "$svc" '.[$s]' <<< "$json")"
          done
          echo "digests=$json" >> "$GITHUB_OUTPUT"
          {
            echo "### Promote $VERSION (commit ${SHA::12})"
            jq -r 'to_entries[] | "- \(.key): `\(.value)`"' <<< "$json"
          } >> "$GITHUB_STEP_SUMMARY"

      # App token scoped to the gitops repo. It opens a PR (branch push + PR);
      # it must NOT be able to bypass the review on main.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.QNSC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
          owner: quynhonsemiconductor
          repositories: gitops
          permission-contents: write
          permission-pull-requests: write

      - uses: quynhonsemiconductor/ci/actions/bump-gitops-tag@db42e37e2f62255b27dadd301d585d8edac1c62b  # ci#281
        with:
          product: rova
          env: prod
          services: api worker migrator
          tag: ${{ github.ref_name }}
          digests: ${{ steps.images.outputs.digests }}
          mode: pull-request
          gitops-token: ${{ steps.app.outputs.token }}

  # The prod SPA follows the tag in the SAME run. `needs: promote` is the
  # ordering gate: that job returns only once GHCR holds all three images for
  # this commit (the wait added in #864), so the web cannot ship ahead of the
  # API release it belongs to. The called workflow keeps its own
  # WEB_WORKER_PROD_ENABLED check and per-environment concurrency group.
  deploy-web:
    name: Deploy prod web
    needs: promote
    permissions:
      contents: read
      actions: read # wait-for-run reads the Web · CI run
      packages: read # @quynhonsemiconductor/* from GitHub Packages
    uses: ./.github/workflows/web-deploy-worker.yml
    with:
      environment: production
      tag: ${{ github.ref_name }}
