# =============================================================================
# Release · Promote — a vX.Y.Z tag RETAGS the digests already published for that
# commit and opens the reviewed gitops prod PR. It builds NOTHING.
#
# The work lives in ci's reusable (v1.33.0): release-retag verifies each digest's
# build attestation and adds vX.Y.Z to the SAME digest, then the promote job
# writes values/rova/tags.prod.yaml and opens the PR. Not auto-merged: merging
# that PR is the production gate. Rollback = revert that PR.
#
# `web` is NOT in `services`: gitops values/rova has no web image yet (D's
# chart). When it lands, add `web` here and to ghcr-publish's bump-dev list.
# =============================================================================
name: Release · Promote

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-promote-rova
  cancel-in-progress: false

jobs:
  # release-please pushes the tag on the SAME merge commit whose GHCR · Publish
  # run is still building. release-retag looks for sha-<12> once and exits 1 if it
  # is not there yet, so wait for that run first and propagate its conclusion:
  # a failed or cancelled publish must fail the promotion, not race it.
  wait-for-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # wait-for-run reads the run list
    steps:
      - uses: quynhonsemiconductor/ci/actions/wait-for-run@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          workflow: ghcr-publish.yml
          sha: ${{ github.sha }}
          branch: main
          label: GHCR · Publish
          max-wait-minutes: '45'
          failure-message: "The GHCR · Publish run for this release commit did not succeed, so there is no sha-<12> image to retag. Fix the build, then re-run this release job."
          missing-message: "No GHCR · Publish run exists for this commit. Cut the release from a commit that was published to main."

  promote:
    needs: wait-for-publish
    # Ceiling for the reusable's jobs: the retag job pushes an image tag
    # (packages: write) and verifies attestations (attestations: read).
    permissions:
      contents: read
      packages: write
      attestations: read
    # SHA-pinned, NOT @v1 — a moving ref would let a ci merge change this product's
    # release pipeline unseen.
    uses: quynhonsemiconductor/ci/.github/workflows/release-promote.yml@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
    with:
      product: rova
      gitops-product: rova
      release-tag: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      services: api worker migrator
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
