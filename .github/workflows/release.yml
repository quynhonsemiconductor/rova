# =============================================================================
# Release Please — auto-creates a "chore(release): vX.Y.Z" PR on every
# main push, then auto-tags when that PR is merged.
# The tag deploys nothing by itself: prod moves only through a reviewed gitops PR.
#
# Delegates to the shared reusable workflow in ci so release logic stays
# DRY across products. QNSC_AUTOMATION_APP_ID (org var) is read automatically;
# QNSC_AUTOMATION_PRIVATE_KEY (org secret) is passed explicitly below.
# =============================================================================
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: quynhonsemiconductor/ci/.github/workflows/release-please.yml@3b998f73d2fd4648aa1d22f1c2c3354c323de590 # v1.29.0
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}