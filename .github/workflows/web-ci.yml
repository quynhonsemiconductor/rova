# =============================================================================
# CI — fast quality gates on every PR and push to main
# Gate: lint → typecheck → unit tests → build → pr-title
# Security scans live in the Security · Scan workflow — independently runnable.
# =============================================================================
name: Web · CI

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see push above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a stacked PR — one aimed at the branch below it — got NO tests, no lint
    # and no security scan, silently. Phase 7's eight-PR stack sat in exactly that state:
    # seven of eight PRs reported 3-5 checks instead of 22, all green, having run almost
    # nothing.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. It had no upside and one silent failure mode.
    # NOT `edited`. That action exists only for the PR-title check, which now lives in
    # pr-title.yml — and listening for it here was actively harmful: combined with
    # `cancel-in-progress: true` below and the `if: action != 'edited'` guards this workflow
    # used to carry, editing a PR title or body CANCELLED the in-flight real run and replaced
    # it with one where every heavy job skipped. GitHub counts a skipped required check as
    # passing, so the PR went green having executed nothing. Every run of this workflow is now
    # a real one.
    types: [opened, synchronize, reopened]

concurrency:
  # A PUSH TO MAIN IS NEVER CANCELLED, and that takes a group of its own per commit. The group used to be
  # `ci-web-${{ github.ref }}` with cancel-in-progress, so two commits landing on main close together shared
  # `ci-web-refs/heads/main` and the second CANCELLED the first's run. The first commit's deploy then failed its
  # "wait for Web · CI on this commit" gate: a green commit that could not deploy ("Canceling since a higher
  # priority waiting request for ci-web-refs/heads/main exists").
  #
  # `cancel-in-progress: false` alone would NOT have fixed it: GitHub keeps ONE pending run per group and cancels
  # every other pending one, so a third push still killed the second's run. Only a distinct group per commit
  # keeps them all.
  #
  #   pull_request -> one group per PR, cancel in progress (a newer push to the PR supersedes the older run:
  #                   unchanged behaviour; refs/pull/N/merge was already per PR)
  #   push (main)  -> one group per COMMIT, never cancelled
  #   anything else (schedule, dispatch) -> its own run id, so it can neither cancel nor be cancelled by a push
  #
  # `pr-title.yml` deliberately has its own group and is unaffected.
  group: ci-web-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('main-{0}', github.sha) || format('{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # No longer for the semantic-PR action — that moved to pr-title.yml, which declares its
  # own. Kept because it is read-only and removing a permission is a bigger claim than
  # this change is making: nothing here needs it today (the openapi job reads
  # `github.event.pull_request.base.sha` straight off the payload, which needs no grant).
  pull-requests: read
  packages: read       # pull @quynhonsemiconductor/* from GitHub Packages (via shared libs)

env:
  # 24, matching .nvmrc and the Dockerfile — see backend-ci.yml for why this was 22.
  # Measured here too before bumping: statements 84.50 / branches 77.48 / functions 83.22 /
  # lines 88.32 against floors of 60, so the web suite has ample headroom on 24.
  NODE_VERSION: '24'
  PNPM_VERSION: '11.28.5'

jobs:
  # Does this pull request change anything this workflow tests? A change that touches only files the matching DEPLOY workflow ignores
  # (its `paths-ignore`) cannot affect what this workflow builds, so the heavy jobs are skipped and one cheap gate reports instead.
  # A push to main ALWAYS runs everything (deploys wait for that run), and every doubt (API error, empty file list, any file not on
  # the list) runs everything too: see actions/changed-paths in the ci repo.
  # WEB CI IGNORES ONLY DOCS. Its E2E job builds and runs the REAL API and migrations, the only full-stack end-to-end in the repo, so
  # a change to apps/api, libs or db must still run it. (Backend CI can skip web-only changes; the reverse is not true.)
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - id: paths
        uses: quynhonsemiconductor/ci/actions/changed-paths@v1
        with:
          ignore: |
            **/*.md
            docs/**
            .claude/**
          # A release-please PR: only when the author is the release bot (a branch name is chosen by whoever opens the PR, so the
          # prefix alone proves nothing) AND the diff is the changelog, the manifest and `version` lines. The push to main it becomes
          # runs everything. Renovate PRs are NOT skipped: an action bump must be exercised on its PR.
          skip-heads: |
            release-please--@qnsc-automation[bot]=CHANGELOG.md,.release-please-manifest.json,version-only:**/package.json

  # ─────────────────────────────────────────────────────────────────────────
  # 1. Lint + typecheck (fast gate — no deps needed)
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint & typecheck
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Lint
        run: pnpm --filter rova-web lint

      - name: Typecheck
        run: pnpm --filter rova-web typecheck

      # The deploy path, without credentials. Web · Deploy publishes with cloudflare/wrangler-action, which
      # runs `pnpm exec wrangler --version` in apps/web and, if that fails, `pnpm add wrangler@4` AT RUN
      # TIME. On pnpm 11 that add exits 1 (ERR_PNPM_IGNORED_BUILDS: workerd) and broke the develop deploy
      # (run 38140929326). wrangler is now an exact devDependency of rova-web, so the action finds it and
      # installs nothing. This runs the same action, same SHA as the shared web-deploy reusable, on a
      # command that needs no Cloudflare account (bundling the Pages Functions), then asserts that nothing
      # was installed into the workspace. If wrangler ever leaves the lockfile, or workerd's build decision
      # is lost, the step fails here and not on the next push to main.
      - name: Deploy tooling (wrangler) resolves on pnpm 11
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          workingDirectory: apps/web
          packageManager: pnpm
          command: pages functions build functions --outdir ${{ runner.temp }}/pages-functions

      - name: The tooling step installed nothing, and produced a bundle
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json apps/web/package.json pnpm-lock.yaml pnpm-workspace.yaml
          test -s "$RUNNER_TEMP/pages-functions/index.js"
          pnpm --filter rova-web exec wrangler --version

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Unit tests (no DB — pure component/hook/util tests)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      has_tests: ${{ steps.detect.outputs.has_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Detect unit tests
        id: detect
        shell: bash
        run: |
          if find apps/web/src -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests (with coverage)
        if: steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter rova-web test:cov

      - name: Skip empty test suite
        if: steps.detect.outputs.has_tests != 'true'
        run: echo "No unit test files found. Skipping Vitest coverage job."

      - name: Upload coverage
        if: always() && steps.detect.outputs.has_tests == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # 3. E2E (Playwright) — full-stack flows against a live API + seeded DB.
  #    Boots Postgres + Redis, migrates + seeds, starts the API (rate limiting
  #    off so per-test login is allowed), then runs the browser specs. The
  #    Playwright config auto-starts the Vite dev server, which proxies /v1 → API.
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rova_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Shared by migrate/seed, the API process, and the specs.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rova_test?sslmode=disable
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/rova_test?sslmode=disable
      VALKEY_URL: redis://localhost:6379
      CSRF_SECRET: ci-test-csrf-secret-min-32-characters-ok
      COOKIE_SECRET: ci-test-cookie-secret-min-32-characters-ok
      # identity 8: the secret that signs its cookies, and the passwordless sign-in the E2E helper uses (identity
      # refuses it unless NODE_ENV is test or development).
      BETTER_AUTH_SECRET: ci-test-better-auth-secret-min-32-characters-ok
      IDENTITY_TEST_LOGIN: enabled
      # Entra — CI test-only placeholders (never used for real auth). The API validates them at startup.
      ENTRA_TENANT_ID: ci-test-tenant
      ENTRA_CLIENT_ID: ci-test-client
      ENTRA_CLIENT_SECRET: ci-test-secret
      # Render the dev-login form (Vite build flag). The E2E helper signs in via the form, which posts to
      # identity's passwordless /api/auth/test-login, since CI has no Entra tenant.
      VITE_DEV_LOGIN: 'true'
      # Each spec logs in fresh — disable rate limiting so that never 429s.
      DISABLE_RATE_LIMIT: 'true'
      # Rally is SSO-only; the E2E helper signs in via the passwordless test-login endpoint
      # (seeded accounts, NODE_ENV test/development only).
      NODE_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Migrate + seed database
        run: pnpm db:migrate
        env:
          SEED_ON_DEPLOY: 'true'

      - name: Build API
        run: pnpm build:api

      - name: Start API (background)
        run: |
          node --enable-source-maps dist/apps/api/apps/api/src/main.js > /tmp/api.log 2>&1 &
          echo "Waiting for API health..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/v1/healthz >/dev/null 2>&1; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; cat /tmp/api.log; exit 1
        env:
          PORT: '3000'
          # The spec is served only when Swagger is explicitly enabled (it no longer piggybacks on NODE_ENV); the
          # `codegen:check` step below reads it from this API. It only widens the API's own CSP header, which the
          # SPA (served by Vite) and the E2E flows do not depend on.
          SWAGGER_ENABLED: 'true'

      # The SPA's API client is generated from the API's OpenAPI spec and COMMITTED, so it can silently fall behind a DTO change, or be
      # hand-edited, with nothing to notice: `tsc` can pass against stale build info and a route the client has never heard of only fails
      # at runtime. Regenerating from the running API and diffing is the cheapest proof the two agree. This used to run in Backend CI,
      # which skips web-only changes; it lives here, next to the running API, so it runs for every change to either side.
      # Fix a failure with `pnpm --filter rova-web codegen` against a local API, then commit.
      - name: Generated web client matches the spec
        run: |
          curl -sf http://localhost:3000/api/docs-json -o "$RUNNER_TEMP/openapi.json"
          pnpm --filter rova-web codegen:check
        env:
          OPENAPI_SPEC: ${{ runner.temp }}/openapi.json

      - name: Install Playwright browsers
        run: pnpm --filter rova-web exec playwright install --with-deps chromium

      - name: Run E2E
        # No `--reporter=` here: the CLI flag REPLACES the config's reporter array rather than
        # adding to it, which is why the json report was missing and the flake step below had
        # nothing to read. playwright.config.ts picks `list` plus `json` when CI is set.
        run: pnpm --filter rova-web exec playwright test

      # `always()`: the interesting case is a run that PASSED, because a pass hiding a retry is
      # exactly what went unnoticed. Never fails the job — see the script for why the ratchet
      # (`--fail-on-flaky-tests`) is not on yet.
      - name: Flaky tests (passed only on retry)
        if: always()
        run: node scripts/report-flaky-e2e.mjs apps/web/playwright-results.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log || true

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Vite build — verifies the production bundle compiles cleanly.
  #    Publishes the dist as an artifact for the deploy job to consume.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 20
    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build
        run: pnpm --filter rova-web build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 3

  # Security scans (Trivy, CodeQL) → security.yml

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Local quickstart — the README's "Local stack", executed.
  #
  # A clean clone must run with `cp .env.example .env` and the README's commands, nothing else. This job IS that
  # clone: it copies the example, starts the compose stack, migrates (and seeds the demo users), boots the API and the
  # worker from that `.env` with the README's own start scripts, boots the Vite server, and signs in with the dev login
  # THROUGH the Vite proxy. Every other job passes its configuration as `env:` and would stay green while
  # `.env.example` rotted; this one reads nothing else.
  #
  # What it caught on the day it was written: the migrate step connecting as a role that cannot log in, an empty
  # JWT_PRIVATE_KEY and the four ENTRA_* the schema requires (the API did not boot), buckets named `rova-*` in the
  # example and `rally-*` in the LocalStack hook (every upload NoSuchBucket), and a dev login switch in a file nobody
  # copies. It lives in WEB CI because the drift runs both ways: a proxy-port edit in apps/web touches no backend file.
  #
  # The commands below mirror the README (test/env-example.spec.ts fails when the two stop agreeing).
  # ─────────────────────────────────────────────────────────────────────────
  quickstart:
    name: local quickstart
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOGS: ${{ github.workspace }}/quickstart-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: cp .env.example .env
        run: |
          cp .env.example .env
          mkdir -p "$LOGS"

      # `--wait` returns when every healthcheck passes; LocalStack's means the init hook has created both buckets.
      - name: docker compose -f docker-compose.dev.yml up -d --wait
        run: docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 240

      - name: pnpm db:migrate
        run: pnpm db:migrate

      # `SEED_ON_DEPLOY=true` in the example is what makes the migrate step load the demo users. Without them the dev
      # login is refused, so ask the database directly and fail by name rather than at a 401 later.
      - name: The demo users exist
        run: |
          n=$(docker exec rova-postgres psql -U postgres -d rova_dev -Atc "select count(*) from identity.users where email = 'admin@qnsc.dev'")
          echo "admin@qnsc.dev rows: $n"
          test "$n" = 1

      - name: Start the API, the worker and the web dev server
        run: |
          nohup pnpm start:dev        > "$LOGS/api.log"    2>&1 &
          nohup pnpm start:dev:worker > "$LOGS/worker.log" 2>&1 &
          nohup pnpm dev:web          > "$LOGS/web.log"    2>&1 &

      # /readyz is the API's own probe (database and cache both up).
      - name: The API answers /readyz
        run: |
          for _ in $(seq 1 90); do
            if body=$(curl -sf http://localhost:3000/readyz); then
              echo "$body"
              echo "$body" | jq -e '.status == "ok" and .checks.database == "up" and .checks.cache == "up"'
              exit 0
            fi
            sleep 2
          done
          echo "::error::the API did not answer /readyz on :3000 within 3 minutes. Does .env.example boot? (the schema refuses a missing JWT key or ENTRA_* at start)"
          exit 1

      # The worker serves no HTTP, and `nest start --watch` keeps running after a config refusal, so the log is the
      # signal: it must say its relays started and must not contain an error (a refusal names the variable).
      - name: The worker started from the same .env
        run: |
          for _ in $(seq 1 60); do
            grep -q "Email relay started" "$LOGS/worker.log" && break
            sleep 2
          done
          grep -q "Email relay started" "$LOGS/worker.log" || { echo "::error::the worker did not start"; exit 1; }
          sleep 10
          if grep -aE '"level":"(error|fatal)"|ERROR|FATAL' "$LOGS/worker.log" "$LOGS/api.log"; then
            echo "::error::an error in the API or worker log after boot"
            exit 1
          fi

      # THROUGH THE VITE PROXY (:5173), not the API directly: this is the call a browser makes, and it is the one that
      # breaks when the example's PORT and the proxy target disagree.
      - name: Sign in with the test login and make an authenticated /v1 call, through the SPA's proxy
        run: |
          for _ in $(seq 1 30); do curl -sf http://localhost:5173/v1/healthz >/dev/null && break; sleep 2; done
          curl -sf http://localhost:5173/v1/healthz || { echo "::error::/v1 through the Vite proxy failed: .env.example PORT must equal the proxy target in apps/web/vite.config.ts"; exit 1; }
          # identity's session cookie is `__Secure-rova.session_token`: read it from the response headers and replay it by hand
          # (a cookie jar will not send a Secure cookie over http).
          curl -sf -D "$LOGS/headers.txt" -o /dev/null -H 'content-type: application/json' -H 'origin: http://localhost:5173' \
            -d '{"email":"admin@qnsc.dev"}' http://localhost:5173/api/auth/test-login
          cookie=$(grep -i '^set-cookie: __Secure-rova.session_token=' "$LOGS/headers.txt" | head -1 | sed -E 's/^[^:]*: ([^;]*).*/\1/' | tr -d '\r')
          test -n "$cookie" || { echo "::error::test-login set no session cookie"; exit 1; }
          me=$(curl -sf -H "cookie: $cookie" http://localhost:5173/v1/auth/me)
          echo "$me" | jq '{email, role}'
          echo "$me" | jq -e '.email == "admin@qnsc.dev" and .role == "workspace_admin"'
          curl -sf -H "cookie: $cookie" -o /dev/null -w 'GET /v1/projects -> %{http_code}\n' http://localhost:5173/v1/projects

      - name: Logs
        if: always()
        run: |
          for f in api worker web; do echo "::group::$f.log"; tail -n 120 "$LOGS/$f.log" || true; echo "::endgroup::"; done
          docker compose -f docker-compose.dev.yml ps || true

      - name: Tear down
        if: always()
        run: |
          pkill -f "nest start" || true
          pkill -f vite || true
          docker compose -f docker-compose.dev.yml down -v || true

  # ── The aggregate gate ──────────────────────────────────────────────────────
  # `Web CI required` is THE required check for this workflow. See backend-ci.yml's
  # copy of this note for the full reasoning; the short version is that GitHub counts a
  # SKIPPED or CANCELLED required check as PASSING, so naming each job in the ruleset
  # cannot catch a job that never ran — and every false-green recorded in this repo
  # (pr-title.yml's cancelled-run incident, Phase 7's 3-of-22 checks) is that bug.
  #
  # Named `Web CI required`, not `CI required`, deliberately: this workflow and
  # backend-ci.yml BOTH publish a job called `Lint & typecheck`, and a required check
  # matched by name against two producers is ambiguous. The two gates carry distinct
  # names so the ruleset can require both without guessing which workflow answered.
  #
  # `needs` MUST list every job above. A job missing from this list is a job outside
  # the gate. The assertion lives in `quynhonsemiconductor/ci` — see backend-ci.yml.
  ci-required:
    name: Web CI required
    if: always()
    needs: [changes, quality, test, e2e, build, quickstart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No `allow-skipped`, so a renamed or removed job still fails loudly. The two branches are exclusive:
      #  * `changes` said run: every job must be `success`;
      #  * otherwise: only `changes` itself must be `success` (the rest are skipped by design). If `changes` FAILED its output is
      #    empty, this branch runs, and the gate fails: it cannot turn "could not decide" into a pass.
      - name: Every job must have succeeded
        if: ${{ needs.changes.outputs.run == 'true' }}
        uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@v1
        with:
          results: ${{ join(needs.*.result, ',') }}

      - name: Nothing here to test (every changed file is ignorable)
        if: ${{ needs.changes.outputs.run != 'true' }}
        uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@v1
        with:
          results: ${{ needs.changes.result }}
