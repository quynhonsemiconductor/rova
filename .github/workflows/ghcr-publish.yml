# =============================================================================
# GHCR · Publish — on-prem image delivery trigger for rova (ONPREM-PLAN §11.1).
#
# On every merge to main this builds each service image, PRE-PUSH scans it
# (CRITICAL fixable vulns + ANY secret), and pushes
# ghcr.io/quynhonsemiconductor/rova-<service> with the immutable sha-<commit>
# tag. It is the only image build; the reusable refuses any ref except
# refs/heads/main.
#
# The reusable's `digests` output (JSON, service → sha256) is what the
# `bump-dev` job below writes into gitops values/rova/tags.dev.yaml (tag +
# digest), so rova-dev follows main. Prod is promoted by release-promote.yml.
#
# ── ONE IMAGE PER DOCKERFILE STAGE ────────────────────────────────────────────
# The reusable passes `build-target: <service>`, which the Dockerfile REQUIRES:
# the root Dockerfile has one stage per service (`api`, `worker`, `migrator`), and
# with no target Docker builds the LAST one — the on-prem track records the incident
# where every repository silently held three copies of the migrator. The web image
# is its own Dockerfile (apps/web/Dockerfile, target `web`) and its own call below.
# =============================================================================
name: GHCR · Publish

on:
  push:
    branches: [main]
    # Skip when a merge touches ONLY paths this product does not ship (docs). paths-ignore fires only
    # if EVERY changed file matches — a shared change still builds, so under-deploy is impossible.
    # apps/web is NOT ignored any more: the SPA is an image too (publish-web below).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'

  # Manual run of whatever main currently holds.
  workflow_dispatch:

concurrency:
  # One GHCR publish per product at a time (the reusable declares the same
  # group); a push racing a workflow_dispatch serialises instead of racing.
  group: ghcr-publish-backend-rova
  cancel-in-progress: false

jobs:
  publish:
    # Ceiling for the reusable's inner grants: packages: write is the GHCR
    # push AND the Dockerfile's pull of private @quynhonsemiconductor/*; the
    # scan path attests the pushed digest, which needs an OIDC token and the
    # attestation store, so the reusable's job permissions must be granted here.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # SHA-pinned, NOT @v1 — ci's v1 tag moves on every merge, and a moving ref
    # would let a ci merge change this product's publish pipeline unseen.
    uses: quynhonsemiconductor/ci/.github/workflows/ghcr-publish.yml@af30ee9edccfda320d0207c056a6c7271774857b # v1.33.0
    with:
      product: rova
      services-json: '["api","worker","migrator"]'
      # The on-prem k3s host is amd64; native amd64 runner (a QEMU build of
      # this pnpm + Nest compile fails — see the reusable's build_runner note).
      platforms: linux/amd64
      build_runner: ubuntu-24.04

  # The SPA as an image (DELIVERY-DESIGN-2026-11 §3.1): the Vite bundle in a read-only Caddy. It is
  # a SECOND call to the same reusable rather than another entry in the matrix above, because the
  # reusable takes ONE `dockerfile` per call and the web has its own (apps/web/Dockerfile; the root
  # Dockerfile has one stage per Node service). Same workflow, same scan-before-push, same digest.
  #
  # Not in `bump-dev` yet: gitops values/rova has no `web` image until D's chart lands, and a value
  # its chart does not know would be noise in every dev bump. It joins at the dev cutover.
  #
  # Permissions and registry token MATCH the `publish` job above exactly (contents: read, packages:
  # write, id-token: write, attestations: write; `node-auth-token` unset, so the composite uses this
  # job's GITHUB_TOKEN for the pnpm install). The web image is attested the same way as the
  # services: the scan path attests the pushed digest.
  publish-web:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: quynhonsemiconductor/ci/.github/workflows/ghcr-publish.yml@af30ee9edccfda320d0207c056a6c7271774857b # v1.33.0
    with:
      product: rova
      services-json: '["web"]'
      dockerfile: apps/web/Dockerfile
      platforms: linux/amd64
      build_runner: ubuntu-24.04

  # rova-dev follows main: ONE dev bump per product.
  #
  # Why not the reusable's `bump-dev` input on both publish calls: both calls are
  # the same commit, so both would target the SAME branch `bump/rova-dev-<tag>`;
  # the concurrency group serialises them, but the action creates+pushes the
  # branch (no force, no ls-remote check), so the second push is rejected and the
  # run is red. One job that needs both calls and makes ONE bump call is the
  # "merge web into one call" option.
  #
  # Only services that exist in gitops values/rova are written. `web` is built and
  # published but gitops has no web image yet (D's chart); it joins the list when
  # the chart lands. Extra digests in the map are harmless (the action writes the
  # services it is given).
  bump-dev:
    needs: [publish, publish-web]
    # A web build failure must not stop the API/worker dev bump.
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      # Two bumps race on one file; serialise them (the action rebases on push).
      group: gitops-bump-rova-dev
      cancel-in-progress: false
    steps:
      # App token scoped to the gitops repo only: branch push + open PR + enable auto-merge.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.QNSC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
          owner: quynhonsemiconductor
          repositories: gitops
          permission-contents: write
          permission-pull-requests: write
      # The two publish calls reduce to one digest map. `*` is a shallow merge:
      # api/worker/migrator and web never share a key.
      - id: digests
        env:
          SERVICES_DIGESTS: ${{ needs.publish.outputs.digests }}
          WEB_DIGESTS: ${{ needs.publish-web.outputs.digests }}
        run: |
          set -euo pipefail
          merged=$(jq -c -n --argjson a "${SERVICES_DIGESTS:-{}}" --argjson b "${WEB_DIGESTS:-{}}" '$a * $b')
          echo "digests=$merged" >> "$GITHUB_OUTPUT"
      - uses: quynhonsemiconductor/ci/actions/bump-gitops-tag@af30ee9edccfda320d0207c056a6c7271774857b  # v1.33.0
        with:
          product: rova
          env: dev
          services: api worker migrator
          tag: ${{ needs.publish.outputs.tag }}
          digests: ${{ steps.digests.outputs.digests }}
          mode: pull-request
          auto-merge: 'true'
          gitops-token: ${{ steps.app.outputs.token }}
