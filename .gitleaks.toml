# EXTENDS the default ruleset — it does not replace it.
#
# Without this block gitleaks 8 treats a discovered config as THE config, so a file
# that defines only an [allowlist] and no [[rules]] leaves the scanner with an empty
# ruleset. It then finds nothing, exits 0, and the required `Secret scan (Gitleaks)`
# check goes green — a security control whose failure mode is silent success. That is
# what this file did from the day it was added until 2026-09-09; verified by probe, a
# real `ghp_` token planted in this tree was NOT detected while this block was absent,
# and IS detected with it.
#
# Never delete these two lines to "simplify" the config.
[extend]
useDefault = true

title = "rally gitleaks config"

[allowlist]
description = "Known false-positives in test and dev files"

# vitest.config.ts carries test-only placeholder values (BETTER_AUTH_SECRET, COOKIE_SECRET, CSRF_SECRET).
paths = [
  '''vitest\.config\.ts''',
  # The e2e config sets the same kind of test-only placeholder for the e2e run.
  '''test/vitest\.e2e\.config\.ts''',
]

# Hardcoded dev/CI service credentials intentionally public.
# postgres/postgres is the standard docker-compose convention for ephemeral CI containers.
regexes = [
  # The throwaway ES256 key that .env.example and vitest.config.ts carried under identity 7 (base64 of the PEM, which gitleaks
  # decodes: the finding's secret is the DECODED PEM, allow-listed by the body of that exact key). Both files no longer carry
  # it, but the scan reads the whole git history (`--log-opts=--all`), where it stays. Nothing else matches it, so a different
  # key pasted anywhere is still caught.
  '''MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQguroUP5ujCG9PaA7F''',
  '''POSTGRES_PASSWORD:\s*postgres''',
  # CI CSRF placeholder. The literal is self-describing and exists only to satisfy
  # CSRF_SECRET's 32-character minimum in CI jobs. A REGEX rather than a
  # .gitleaksignore fingerprint because fingerprints are commit-scoped and this value
  # recurs in every new commit touching those workflow lines — the existing fingerprints
  # already went stale when ci.yml was split into backend-ci.yml and web-ci.yml, which
  # is why four findings surfaced the moment scanning was actually armed.
  # Anchored to the exact literal, so it can never suppress anything else.
  '''ci-test-csrf-secret-min-32-characters-ok''',
  # identity 8's cookie-signing secret, same reasoning: self-describing CI and local placeholders, exact literals.
  '''ci-test-better-auth-secret-min-32-characters-ok''',
  '''local-dev-only-better-auth-secret-0123456789abcdef''',
  # ACM certificate ARNs — contain AWS account ID but are infrastructure references, not credentials.
  '''arn:aws:acm:[a-z0-9-]+:074487692297:certificate/[0-9a-f-]+''',
  # Entra (Azure AD) OAuth identifiers — tenant ID and client ID are public in OAuth flows.
  '''entra_tenant_id\s*=\s*"dc0f2078-ac28-4ff2-b21a-d4b28df32361"''',
  '''entra_client_id\s*=\s*"45fabceb-e51c-446b-894e-af4c4b7f30f8"''',
]
