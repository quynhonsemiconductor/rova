<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rova</title>

    <!-- Security: prevent search-engine indexing of this internal app -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Security: Content-Security-Policy — served as an HTTP header from public/_headers     -->
    <!-- (Pages today, Workers Static Assets after the on-prem move). A <meta> CSP here was    -->
    <!-- the dev-only baseline; it is gone because the header file carries the real policy     -->
    <!-- and multiple CSPs intersect, so a stale meta could only ever tighten it wrongly.      -->
    <!-- Local `pnpm dev` runs without a CSP; the header file documents every origin there.    -->

    <!-- Branding: theme color for browser chrome -->
    <meta name="theme-color" content="#1d3f73" />
  </head>
  <body>
    <!-- Accessibility: skip-to-content landmark (styled via globals.css) -->
    <a href="#main-content" class="skip-nav">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
