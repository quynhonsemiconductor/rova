packages:
  - "apps/web"
# Moved from package.json's "pnpm.overrides" — pnpm 11 no longer reads that
# field (silently ignored, see `pnpm install`'s own warning). Without this,
# @nestjs/platform-fastify's own fastify@5.8.5 dependency and the app's direct
# fastify@^5.10.0 resolve to two separate copies in node_modules, so every
# @fastify/* plugin (typed against 5.10.0) fails to structurally match the
# FastifyInstance type NestFastifyApplication exposes (typed against 5.8.5) —
# this is what broke `nest start --watch`'s type-check entirely.
overrides:
  # Two advisories, both fixed in 5.12.1: GHSA-3m5p-2c4r-xxw2 (X-Forwarded-* spoofing under a
  # hop-count `trustProxy`, CVSS 6.1) and GHSA-w2qp-rph6-63g4 (schema validation bypass via a
  # root primitive, CVSS 5.4). Raised 5.10.0 -> 5.12.3. Still an EXACT pin, for the reason the
  # note below gives: the value's job is to keep ONE fastify copy in the tree, so a range here
  # would reintroduce the two-copy type mismatch it exists to prevent.
  fastify: "5.12.5"
  "esbuild@<0.25.0": ">=0.25.0"
  # GHSA-rgw5-rvv9-x895 — HIGH (CVSS 7.5) DoS via unbounded intermediate arrays,
  # vulnerable <5.0.9, fixed 5.0.9. It explicitly BYPASSES the CVE-2026-14257
  # mitigation, which is what the previous pin here was for (GHSA-mh99-v99m-4gvg,
  # fixed 5.0.8) — so 5.0.8 is no longer a safe floor, not merely an older one.
  # The range spans every published major, so force the whole tree to 5.0.9 (leaf
  # util; the tree already accepted a forced 5.x across majors).
  "brace-expansion": "5.0.12"
  # THREE advisories now, each raising this floor in turn — GHSA-pm4m-ph32-ghv5, then
  # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870, quadratic CPU in !!omap resolution, CVSS 7.5,
  # fixed 4.3.1), and now GHSA-2883-xcg3-v3hh (CVSS 7.5): `maxTotalMergeKeys` counts only
  # the keys a merge actually CONTRIBUTES, so an alias chain of EMPTY merge sources costs
  # CPU without ever incrementing the counter the limit reads — the mitigation for the
  # previous advisory is what the new one walks past. Fixed in 4.3.2, not backported to 3.x.
  #
  # Transitive only: @redocly/openapi-core (the SPA's openapi-typescript codegen) and
  # cosmiconfig 8.x/9.x (@nestjs/cli, commitlint, @nestjs/swagger). Nothing here parses
  # untrusted YAML at runtime, so this is a blocking-scanner fix rather than a production
  # exposure — but `osv_blocking=true` means a lockfile the scanner rejects blocks every
  # unrelated PR, which is its own kind of outage.
  #
  # `^` and not `>=`: the looser form resolves into 5.x, whose API @nestjs/swagger 11.x and
  # cosmiconfig were not built against. The 5.x line has its own entry below.
  "js-yaml@4": "^4.3.2"
  # GHSA-pm4m-ph32-ghv5 — js-yaml 5.x, fixed in 5.2.2. Transitive via cosmiconfig
  # (@nestjs/cli, commitlint) + @nestjs/swagger. Newly published advisory that
  # also affects main; pinned via override.
  #
  # RAISED 5.2.2 -> 5.4.1 for GHSA-r3ph-w7gj-g6xm (CVSS 5.3): the 5.x line's `maxTotalMergeKeys`
  # had the same empty-merge-source CPU hole the 4.x entry above describes, fixed in 5.4.1.
  "js-yaml@5": "^5.4.1"
  # GHSA-c96f-x56v-gq3h — HIGH "DDoS with HTTP2", fixed in 9.7.0. Transitive
  # via fastify@5.10.0 / @nestjs/platform-fastify (declared range ^9.6.0, so
  # 9.7.0 is in-range). A newly published advisory that also affects main.
  "find-my-way@<9.7.0": "9.7.0"
  # GHSA-4c8g-83qw-93j6, GHSA-7p8r-x3mc-p8w7 and now GHSA-5jgf-p345-68v8 /
  # GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf / GHSA-jqff-g426-hqxp (CVSS 7.5 each) — host
  # confusion and SSRF in the same URI parser, six advisories running: failed IDN
  # canonicalisation, a backslash authority introducer, malformed and repeated authority forms,
  # and percent-encoded schemes. Fixed in 3.1.6 on the 3.x line.
  #
  # Reachable only as a deep transitive dep (fastify -> @fastify/ajv-compiler ->
  # fast-json-stringify / ajv -> fast-uri), so pinned here rather than as a direct dependency.
  # This one reaches PRODUCTION, unlike the undici pins below.
  #
  # THE UPPER BOUND IS THE POINT, and its absence was a real defect. Every consumer in this tree
  # declares `^3.0.0` or `^3.0.1` — nothing asks for 4.x — but the previous value was an
  # unbounded `>=3.1.5`, so pnpm resolved the newest thing satisfying it and dragged the whole
  # tree onto fast-uri 4.1.2, a major nobody declared. That is what osv-scanner then flagged on
  # `main` under the four new advisories: an override written to CLOSE this parser's holes is
  # what carried the tree into the unpatched major. Keep the floor inside the declared major, the
  # way the undici pins below keep each consumer inside the major it asks for.
  #
  # RAISED 3.1.6 -> 3.1.8 for GHSA-hrr3-gc8f-f4qj (CVSS 4.8, inconsistent host case normalisation
  # via percent-encoded octets), fixed in 3.1.8 on the 3.x line. Upper bound kept, for the reason
  # above.
  "fast-uri@<3.1.8": ">=3.1.8 <4.0.0"
  # GHSA-55q2-fjhq-7xh7 — DOMPurify, "IN_PLACE hook removal leaves a detached subtree
  # executable", fixed in 3.4.13. This one REACHES PRODUCTION and is a real XSS sink:
  # dompurify is a DIRECT dependency of apps/web (^3.4.12), used to sanitise rendered
  # HTML, so this is not a scanner-appeasement pin like the undici ones below.
  #
  # apps/web's own range already admits 3.4.13; the lockfile was simply resolved before
  # the advisory published. The override is here anyway so a fresh resolution cannot go
  # backwards, and so `@types/dompurify` (which pins the runtime package as a real
  # dependency, not a peer) moves with it.
  #
  # RAISED 3.4.13 -> 3.4.16 for GHSA-p98j-92pf-mc4p (CVSS 2.3): a node-removing `afterSanitize`
  # hook in IN_PLACE mode left the detached subtree's event handlers armed — the same sink as
  # above, so it is the same production exposure. Introduced in 3.4.13, fixed in 3.4.16.
  "dompurify@<3.4.16": ">=3.4.16"
  # GHSA-2v37-7h3g-55p8 — nanoid, "custom generators can loop indefinitely when size is
  # zero". Reached only via postcss -> nanoid, i.e. the web BUILD toolchain, and postcss
  # calls it with a fixed non-zero size — so the zero-size path is not reachable here.
  # Pinned to clear the blocking scanner rather than because it is exploitable in this tree.
  #
  # RAISED 3.3.17 -> 3.3.18 on 2026-08-14, which is the previous note's own instruction
  # carried out. The advisory's fixed version MOVED: it named 3.3.17 when this pin was
  # written, and now names 3.3.18, so osv-scanner began failing `Security · Scan` on main —
  # the pin that used to satisfy the gate became the thing tripping it.
  #
  # The old note pinned 3.3.17 exactly because 3.3.18 had published 2026-08-07 and this
  # repo's `minimumReleaseAge` cooldown (24h) rejected it at the time, so the CVE fix and
  # the supply-chain policy pulled in opposite directions. That has resolved itself: 3.3.18
  # is seven days old, comfortably outside the cooldown.
  #
  # Still PINNED rather than a floor, and still deliberately NOT forced across majors —
  # postcss declares ^3.3.11 and 4.x+ are ESM-only, so a cross-major force would break the
  # build exactly the way the undici pin below once broke jsdom.
  #
  # Raise this by hand again if the advisory names a later fix; there is no floor here doing
  # it automatically, and that is the trade for surviving the cooldown window.
  "nanoid@>=3.0.0 <3.3.18": "3.3.19"
  # GHSA-r28c-9q8g-f849 — postcss (line-return parsing), fixed in 8.5.18.
  # Transitive via the web build toolchain (vite / tailwind ecosystem). A newly
  # published advisory that also affects main; pinned via override.
  "postcss@<8.5.18": ">=8.5.18"
  # GHSA-4mjr-xmp4-gh2g (DoS via an attacker-controlled `isBuffer`, CVSS 6.3) and
  # GHSA-x5fp-wj9c-mxmx (array-limit bypass via bracket-key comma parsing, CVSS 6.3), both
  # fixed in 6.16.0. DEV-ONLY: the sole path is supertest -> superagent -> qs, so nothing here
  # ships in the runtime image — the API parses its own query strings through fastify, not qs.
  # Pinned anyway because the scanner is `osv_blocking=true` and a lockfile it rejects blocks
  # every unrelated PR.
  "qs@<6.16.0": ">=6.16.0"
  # GHSA-73wf-gq98-2v4g (uncaught crash / prototype write from an untrusted query) and
  # GHSA-c83g-rgw3-j3cx (unbounded memory growth, no cache eviction), CVSS 7.5 each, both fixed
  # in 4.28.7. DEV-ONLY and build-time: reached via @babel/helper-compilation-targets, webpack
  # and update-browserslist-db, all of which read the browserslist config committed in this
  # repo — the untrusted-input precondition does not exist here. Floor rather than a pin, since
  # the consumers all declare `>= 4.21.0` and nothing depends on an exact patch.
  "browserslist@<4.28.7": ">=4.28.7"
  # GHSA-cp6q-959q-f8rh — `mergeAttributes()` turns an own `__proto__` key into inherited state
  # (prototype pollution), CVSS 6.4, fixed in 3.30.4. This one REACHES PRODUCTION: tiptap is the
  # SPA's rich-text editor (@tiptap/react + starter-kit + extensions, all direct deps of
  # apps/web), and the editor renders user-authored comment content. apps/web's own `^3.28.0`
  # ranges already admit the fix — the lockfile was simply resolved before the advisory
  # published — so this floor exists to stop a fresh resolution going backwards, the same job
  # the dompurify pin above does.
  "@tiptap/core@<3.30.4": ">=3.30.4"
  # Five advisories against undici, the worst GHSA-4cwx-7wf7-3272 (CVSS 7.4,
  # cross-user information disclosure + parse-time crash via degenerate private
  # cache directives). Fixed in 7.29.0 and 8.9.0 respectively.
  #
  # DEV-ONLY, both trees: 7.x arrives via jsdom → vitest, 8.x via testcontainers,
  # all devDependencies. Nothing here ships in the runtime image, so this is not a
  # production exposure — but the scanner is `osv_blocking=true` and a lockfile the
  # scanner rejects blocks every unrelated PR, which is its own kind of outage.
  #
  # TWO ranges, one per major, and they must stay that way. jsdom@29.1.1 declares
  # `undici@^7.25.0` and reaches into the internal `undici/lib/handler/wrap-handler.js`,
  # which 8.x DELETED — so a single `<8.9.0: >=8.9.0` floor dragged jsdom onto 8.9.0 and
  # every jsdom-environment suite died at worker startup with MODULE_NOT_FOUND, before a
  # single test ran. Backend suites are unaffected (node environment), which is exactly
  # why this passed locally and failed in CI on the web tests.
  #
  # Keep each consumer inside the major it declares:
  #   7.x — jsdom → vitest         (patched in 7.29.0)
  #   8.x — testcontainers          (patched in 8.9.0)
  #
  # RAISED 7.29.0 -> 7.29.1 and 8.9.0 -> 8.10.2 for eleven further advisories on both lines (the
  # worst GHSA-rfgv-xxqx-mfg5, CVSS 7.5, DoS via an unrequested WebSocket subprotocol; also TLS
  # validation bypass in BalancedPool, Set-Cookie leakage through shared caches, response
  # splitting via the retry interceptor). Still dev-only, still one range per major.
  "undici@>=7.0.0 <7.29.1": ">=7.29.1 <8.0.0"
  "undici@>=8.0.0 <8.10.2": ">=8.10.2"
  # GHSA-f596-whhp-79r4 (CVSS 3.7, server leaks handler error messages in status) and
  # GHSA-m9gg-hp2v-232j (CVSS 7.4, `getAuthContext` can report unauthorised certificates as
  # authorised), both fixed in 1.14.5 on the 1.14 line. RUNTIME: reached via @nestjs/terminus and
  # the OpenTelemetry gRPC exporters (sdk-node). Floor kept inside 1.x, the major every consumer
  # declares.
  "@grpc/grpc-js@>=1.14.0 <1.14.5": ">=1.14.5 <2.0.0"
  # GHSA-hrh2-vp3x-79xf (CVSS 9.1) — path traversal via a symlink chain, fixed in 11.1.4.
  # DEV-ONLY: @swc/cli -> @xhmikosr/bin-wrapper -> downloader -> decompress, which unpacks the
  # swc binary at install time. Not shipped in the runtime image.
  "@xhmikosr/decompress@>=11.0.0 <11.1.4": ">=11.1.4 <12.0.0"
  # GHSA-67c8-pqhq-4rmx (CVSS 9.2) — prototype-pollution gadget in ThreadPool options (execArgv /
  # env) allowing RCE, fixed in 4.9.4 on the 4.x line. DEV-ONLY: @swc/cli (via @nestjs/cli) uses it
  # for parallel compilation. Kept inside 4.x, the major @swc/cli declares.
  "piscina@<4.9.4": ">=4.9.4 <5.0.0"
  # GHSA-x8mw-p69m-v3mx / GHSA-xjh9-v7x6-24jw (CVSS 7.5 each, DoS via a prototype-named part
  # header and via an oversized boundary, fixed in 3.2.1) and GHSA-gxm5-99cw-xjw9 (CVSS 5.8, CRLF
  # injection through the Content-Disposition filename / name, fixed in 3.2.2). RUNTIME and
  # INTERNET-FACING: @fastify/multipart -> @fastify/busboy parses every attachment upload. Every
  # @fastify/multipart release (10.1.2 included) still declares `^3.0.0`, so bumping the plugin
  # alone would not move it; the floor does, kept inside 3.x.
  "@fastify/busboy@<3.2.2": ">=3.2.2 <4.0.0"
  # GHSA-p6vx-979v-rg4c (CVSS 9.8, `fromJSON()` thenable assimilation invoking plugin-produced
  # callables, fixed 1.6.2) and GHSA-jp82-f5mq-hwhp (CVSS 7.5, memory exhaustion via an unchecked
  # TypedArray length, fixed 1.6.3). Shipped in the SPA bundle via @tanstack/router-core, which
  # declares `^1.5.4`, so 1.6.x is in-range — the lockfile was resolved before the fix. Kept in 1.x.
  "seroval@<1.6.3": ">=1.6.3 <2.0.0"
  # GHSA-ch52-4w7c-c8xp (CVSS 8.7) — a client `max-stale` overrode shared-cache reuse
  # prohibitions, so another user's Set-Cookie response could be served. Upstream fixed it in 4.3.0
  # (kornelski/http-cache-semantics#56, closed 2026-10-04); OSV lists it as `last_affected 4.2.0`.
  # DEV-ONLY: @swc/cli -> bin-wrapper -> got -> cacheable-request, fetching the swc binary at
  # install time. Kept in 4.x, the major cacheable-request declares.
  "http-cache-semantics@<4.3.0": ">=4.3.0 <5.0.0"
  # GHSA-jggr-w7fw-pc2j (CVSS 6.3) — stack exhaustion copying deeply nested values, fixed in
  # 4.1.0 on the 4.x line. DEV-ONLY: pino-pretty (the local log formatter; never in the image).
  # PINNED to 4.1.1 (fixed, published 2026-09-02) rather than a floor: the floor resolved 4.1.2,
  # published 2026-10-05T19:12Z — inside the 24h `minimumReleaseAge` cooldown the nanoid entry
  # above describes. Same trade as nanoid: raise by hand if the advisory names a later fix.
  "fast-copy@>=4.0.0 <4.1.0": "4.1.1"
  # GHSA-68fv-2mgg-jv7q (CVSS 8.7) — event-loop DoS via indexed source-map section offsets, fixed
  # in 1.2.2. DEV / BUILD-ONLY: postcss, vite, tailwind, jsdom and coverage all read source maps
  # this repo generates. Every consumer declares `^1.x`; kept in 1.x.
  "source-map-js@<1.2.2": ">=1.2.2 <2.0.0"
  # GHSA-qqmp-wf37-98f9 (CVSS 5.8, the DB username on every query span as `db.user`) is NOT pinned
  # here: the eight instrumentation-* packages are fixed by moving @opentelemetry/
  # auto-instrumentations-node to ^0.79.0 together with the 0.221 experimental line (package.json),
  # so the SDK, the exporters and every instrumentation share one @opentelemetry/instrumentation.
  #
  # GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3) has NO fixed release; it is accepted, time-boxed, in
  # `osv-scanner.toml` at the repo root.
# pnpm 11 wrote this block during its migration and left every value as the literal
# placeholder "set this to true or false". Unresolved, pnpm treats the decision as unmade,
# refuses to run those postinstalls, and exits 1 with ERR_PNPM_IGNORED_BUILDS — and because
# pnpm 11 runs an implicit `install` before every script, that failure blocks EVERY
# `pnpm <script>` in this repo, `db:migrate` included. The values below mirror
# `onlyBuiltDependencies` beneath, which is the allowlist this repo already committed;
# they are not a new trust decision.
allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  argon2: true
  cpu-features: true
  esbuild: true
  msw: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@scarf/scarf'
  - '@swc/core'
  - argon2
  - cpu-features
  - esbuild
  - msw
  - protobufjs
  - ssh2
  - unrs-resolver
